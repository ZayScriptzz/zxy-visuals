<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/logo.png">
<title>Request Received — ZXY Visuals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400&family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#020204;color:#e8e8f0;font-family:'Barlow',sans-serif;font-weight:300;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
  .container{padding:2rem;max-width:600px}
  .mark{width:56px;height:56px;border:1px solid #b82020;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 2rem;font-size:1.4rem;color:#b82020;animation:pop 0.5s ease 0.3s both}
  @keyframes pop{from{transform:scale(0.4);opacity:0}to{transform:scale(1);opacity:1}}
  h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(3rem,8vw,6rem);letter-spacing:0.04em;line-height:1;margin-bottom:1rem}
  h1 span{color:#b82020}
  p{color:rgba(232,232,240,0.5);font-size:0.92rem;line-height:1.85;margin-bottom:2rem}
  a{font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;letter-spacing:0.2em;text-transform:uppercase;color:#e8e8f0;border:1px solid rgba(232,232,240,0.15);padding:0.75rem 1.75rem;text-decoration:none;transition:border-color 0.2s,color 0.2s;display:inline-block}
  a:hover{border-color:#b82020;color:#d63030}
  .divider{margin:1.5rem auto;width:1px;height:40px;background:linear-gradient(180deg,transparent,rgba(184,32,32,0.5),transparent)}
</style>
</head>
<body>
  <div class="container">
    <div class="mark">✓</div>
    <h1>Request<br><span>Received.</span></h1>
    <p>We've got your booking request and will get back to you within 24 hours to confirm the details and lock in your shoot date.<br><br>
    <em style="color:rgba(232,232,240,0.3);font-style:normal">Nous avons bien reçu votre demande et vous répondrons dans les 24 heures.</em></p>
    <div class="divider"></div>
    <a href="index.html">← Back to ZXY Visuals</a>
  </div>
</body>
</html>
